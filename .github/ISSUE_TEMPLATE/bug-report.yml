name: Bug report / repository correction
description: Report a reproducible technical defect or public repository correction for Cross-Entity Logistics Operations
  & Container Profit Console. General questions and ideas belong in central Discussions.
title: '[Bug] Cross-Entity Logistics Operations & Container Profit Console'
body:
- type: markdown
  attributes:
    value: Report one reproducible technical issue per submission. Do not attach original workbooks or production exports.
      A small synthetic example is usually sufficient.
- type: dropdown
  id: problem_area
  attributes:
    label: Workflow area
    description: Choose the closest part of the tool or repository.
    options:
    - Container / declaration identity matching
    - Customs clearance status and release workflow
    - Released-but-undispatched exception logic
    - Fleet dispatch and transport execution
    - Vehicle, driver, fuel, or allowance cost allocation
    - Container-level profit consolidation
    - Customer contribution ranking
    - Status dictionaries and master-data validation
    - Dashboard / alert calculations
    - Other
  validations:
    required: true
- type: dropdown
  id: environment
  attributes:
    label: Where did the issue occur?
    description: Choose the closest environment.
    options:
    - Browser-based tool / web demo
    - Microsoft Excel for Microsoft 365
    - Microsoft Excel 2021
    - Google Sheets preview
    - GitHub profile / Markdown page
    - Other / not sure
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Version / environment details
    description: Provide workbook version, release / commit, browser, Excel build, or exact page / section when relevant.
    placeholder: e.g. release tag / commit; Excel 365 build
  validations:
    required: false
- type: input
  id: summary
  attributes:
    label: Issue summary
    description: A concise title describing the defect or correction.
    placeholder: e.g. Shipment-level allocation does not reconcile to source total
  validations:
    required: true
- type: textarea
  id: expected_actual
  attributes:
    label: Expected result and actual result
    description: Explain what should happen and what happened instead. Identify the affected metric, output, sheet, field,
      or page section.
    placeholder: 'Expected: ...

      Actual: ...'
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    description: List the smallest sequence that reproduces the issue, including relevant assumptions and settings.
    placeholder: '1. Open ...

      2. Enter synthetic values ...

      3. Review ...'
  validations:
    required: true
- type: textarea
  id: safe_example
  attributes:
    label: Synthetic example / proposed correction
    description: Use fictional container IDs, made-up customs milestones, a dummy dispatch record, and synthetic vehicle /
      fuel costs. Show the expected container contribution. Do not include real declarations, driver details, or customer
      data. Do not paste personal, confidential, or production data. Do not attach original exports or workbooks.
    placeholder: 'Synthetic inputs or affected public text: ...

      Expected result: ...

      Actual result: ...'
  validations:
    required: true
- type: checkboxes
  id: privacy_check
  attributes:
    label: Privacy confirmation
    options:
    - label: I have removed personal, confidential, and production data and have used only synthetic or public-safe information.
      required: true
  validations:
    required: true
